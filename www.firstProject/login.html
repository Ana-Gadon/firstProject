<body>
  <div class="login-card">
    <h1>Login</h1>

    <form id="loginForm">
      <div class="input-group">
        <label for="username">Username or email</label>
        <input type="text" id="username" name="username" required>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="*********" required>
      </div>

      <div class="input-group">
        <label>
          <input type="checkbox" id="rememberMe">
          Remember me 
        </label>
      </div>

      <button type="submit" class="login-btn" id="loginBtn">Log in</button>
    </form>
  </div>

<script>
  const loginForm  = document.getElementById('loginForm');
  const loginBtn   = document.getElementById('loginBtn');
  const username   = document.getElementById('username');
  const password   = document.getElementById('password');
  const rememberMe = document.getElementById('rememberMe');

  if (sessionStorage.getItem('sf_user') || localStorage.getItem('sf_user')) {
    window.location.replace('home.html');
  }

  loginForm.addEventListener('submit', function (e) {
    e.preventDefault();

    if (username.value === "admin@gmail.com" && password.value === "admin1234") {
      loginBtn.textContent = 'Redirecting...';


      sessionStorage.setItem('sf_user', username.value);
      sessionStorage.setItem('sf_login_time', new Date().toISOString());

      if (rememberMe.checked) {
        localStorage.setItem('sf_user', username.value);
        localStorage.setItem('sf_login_time', new Date().toISOString());
      } else {
        localStorage.removeItem('sf_user');
        localStorage.removeItem('sf_login_time');
      }

      setTimeout(function () {
        window.location.href = 'home.html';
      }, 600);
    } else {
      alert('Invalid username or password');
    }
  });
</script>
