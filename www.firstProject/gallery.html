<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <title>Home</title>
</head>
<style>
    nav .burger {
    display: flex;
    flex-direction: row;       
    align-items: center;       
    justify-content: flex-start; 
    gap: 10px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 8px 12px;
    font-size: 1.2rem;
}
nav .burger-icon {
    font-size: 1.5rem;
    line-height: 1;
}
nav .burger img {
    display: block;            
    border-radius: 50%;
    object-fit: cover;
}
</style>
<body>

<nav>
    <button class="burger" onclick="toggleMenu()" aria-label="Toggle menu">
        <span class="burger-icon">&#9776;</span>
        <img src="media/logo.png" width="50" height="50" alt="San Fernando Romblon Logo">
        <span>San Fernando Romblon</span>
    </button>
</nav>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <div class="nav-links" id="navLinks">
        <a href="home.html">Home</a>
        <a href="about.html">About</a>
        <a href="gallery.html">Gallery</a>
    </div>

    <main>
        <h1>Gallery </h1>
    </main>
    <section>
        
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d62362.40863957455!2d121.9132054881424!3d12.33929200764918!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x33a4dcdc1aaf98dd%3A0xc85327fb00f90e3e!2sFerrol%2C%20Romblon!5e0!3m2!1sen!2sph!4v1791335864450!5m2!1sen!2sph" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

    </section>


    <script>
        function toggleMenu() {
            document.getElementById("navLinks").classList.toggle("open");
            document.getElementById("overlay").classList.toggle("open");
        }
    </script>

</body>
</html>
