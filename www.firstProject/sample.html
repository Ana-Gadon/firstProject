<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        document.write("Click Button Below<br>");
    </script>
    <button type="button" onclick="triggerbutton()">Trigger the button</button>
    <p id="output"></p>

    <script>
        window.addEventListener('DOMContentLoaded', function () {
            const savedName = localStorage.getItem("Name") 
                           || sessionStorage.getItem("Name");

            if (savedName) {
                document.getElementById("output").textContent =
                    "Saved name: " + savedName;
            } else {
                document.getElementById("output").textContent =
                    "No name saved yet.";
            }
        });

        function triggerbutton() {
            const name = prompt("Enter Name:");
            if (name === null || name.trim() === "") {
                alert("No name was entered.");
                return;
            }

            const confirmed = confirm("Are you sure you want to save entered name: " + name + "?");

            if (confirmed) {
                localStorage.setItem("Name", name);
                sessionStorage.setItem("Name", name);

                const savedName = localStorage.getItem("Name");

                alert("Name saved: " + savedName);
                document.getElementById("output").textContent = "Saved name: " + savedName;
            } else {
                alert("Name was not saved.");
            }
        }
    </script>
</body>
</html>
